<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Calculadora" />
  <link rel="manifest" href="manifest.json" />
  <title>Calculadora</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
      overflow: hidden;
    }

    #hidden-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 0;
      opacity: 0.01;
      pointer-events: none;
    }

    #hidden-canvas {
      display: none;
    }

    .calculator {
      position: relative;
      z-index: 2;
      background-color: #000;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      height: 100dvh;
      max-width: 430px;
      margin: 0 auto;
      padding: 16px 16px calc(24px + env(safe-area-inset-bottom));
    }

    .display {
      text-align: right;
      font-size: 82px;
      font-weight: 300;
      line-height: 1.05;
      padding: 0 12px 18px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: clip;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      border: none;
      border-radius: 50%;
      aspect-ratio: 1 / 1;
      font-size: 34px;
      font-weight: 400;
      color: #fff;
      background-color: #333333;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: filter 0.1s ease;
    }

    button:active {
      filter: brightness(1.4);
    }

    .btn-light {
      background-color: #a5a5a5;
      color: #000;
      font-size: 30px;
      font-weight: 500;
    }

    .btn-orange {
      background-color: #ff9f0a;
      font-size: 38px;
    }

    .btn-zero {
      grid-column: span 2;
      aspect-ratio: auto;
      border-radius: 999px;
      justify-content: flex-start;
      padding-left: 30px;
    }

    /* Indicador discreto no canto inferior direito */
    #status-dot {
      position: fixed;
      z-index: 10;
      bottom: calc(8px + env(safe-area-inset-bottom));
      right: 10px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background-color: transparent;
      pointer-events: none;
    }

    #status-dot.loading { background-color: #555; }
    #status-dot.scanning { background-color: #0a84ff; }
    #status-dot.ready { background-color: #ff9f0a; }

    /* Painel de Teste (Debug) */
    #debug-panel {
      display: none;
      position: fixed;
      top: calc(12px + env(safe-area-inset-top));
      left: 12px;
      right: 12px;
      z-index: 20;
      background: rgba(20, 20, 20, 0.94);
      border: 1px solid #444;
      border-radius: 12px;
      padding: 10px;
      font-size: 13px;
      color: #0f0;
    }

    #debug-panel.visible {
      display: block;
    }

    #debug-preview {
      width: 100%;
      max-height: 85px;
      object-fit: contain;
      background: #111;
      border: 1px solid #333;
      margin-top: 6px;
    }

    /* Painel de Controle Oculto */
    #control-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #control-overlay.visible {
      display: flex;
    }

    .control-box {
      width: 100%;
      max-width: 360px;
      background: #1c1c1e;
      border: 1px solid #333;
      border-radius: 18px;
      padding: 20px;
      color: #fff;
    }

    .control-box h2 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      text-align: center;
      color: #ff9f0a;
    }

    .control-group {
      margin-bottom: 16px;
    }

    .control-label {
      display: block;
      font-size: 13px;
      color: #aaa;
      margin-bottom: 8px;
    }

    .option-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .ctrl-btn {
      aspect-ratio: auto;
      border-radius: 10px;
      padding: 12px 10px;
      font-size: 14px;
      font-weight: 500;
      background: #2c2c2e;
      color: #ccc;
      border: 1px solid #3a3a3c;
    }

    .ctrl-btn.selected {
      background: #ff9f0a;
      color: #000;
      border-color: #ff9f0a;
      font-weight: 600;
    }

    .ctrl-close {
      width: 100%;
      aspect-ratio: auto;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      background: #333;
      color: #fff;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <video id="hidden-video" playsinline autoplay muted></video>
  <canvas id="hidden-canvas"></canvas>
  <div id="status-dot"></div>

  <!-- Painel de Teste (Debug) -->
  <div id="debug-panel">
    <div id="debug-status">Status: Parado (Segure AC para ler)</div>
    <div id="debug-text">OCR leu: —</div>
    <img id="debug-preview" alt="" />
  </div>

  <!-- Painel de Controle Oculto (Segure ± por 1s) -->
  <div id="control-overlay">
    <div class="control-box">
      <h2>Painel de Controle</h2>

      <div class="control-group">
        <span class="control-label">Função do OCR</span>
        <div class="option-row">
          <button class="ctrl-btn" id="mode-date">Conta de Dias</button>
          <button class="ctrl-btn" id="mode-normal">Leitura Normal</button>
        </div>
      </div>

      <div class="control-group">
        <span class="control-label">Câmera</span>
        <div class="option-row">
          <button class="ctrl-btn" id="cam-back">Traseira</button>
          <button class="ctrl-btn" id="cam-front">Frontal</button>
        </div>
      </div>

      <div class="control-group">
        <span class="control-label">Visor de Teste (Debug)</span>
        <div class="option-row">
          <button class="ctrl-btn" id="debug-off">Oculto</button>
          <button class="ctrl-btn" id="debug-on">Visível</button>
        </div>
      </div>

      <button class="ctrl-close" id="btn-close-panel">Fechar</button>
    </div>
  </div>

  <div class="calculator">
    <div class="display" id="display">0</div>
    <div class="buttons">
      <button class="btn-light" id="btn-ac">AC</button>
      <button class="btn-light" id="btn-sign" data-action="sign">±</button>
      <button class="btn-light" data-action="percent">%</button>
      <button class="btn-orange" data-op="/">÷</button>

      <button data-num="7">7</button>
      <button data-num="8">8</button>
      <button data-num="9">9</button>
      <button class="btn-orange" data-op="*">×</button>

      <button data-num="4">4</button>
      <button data-num="5">5</button>
      <button data-num="6">6</button>
      <button class="btn-orange" data-op="-">−</button>

      <button data-num="1">1</button>
      <button data-num="2">2</button>
      <button data-num="3">3</button>
      <button class="btn-orange" data-op="+">+</button>

      <button class="btn-zero" data-num="0">0</button>
      <button data-num=",">,</button>
      <button class="btn-orange" id="btn-eq">=</button>
    </div>
  </div>

  <script>
    const displayEl = document.getElementById('display');
    const btnAc = document.getElementById('btn-ac');
    const btnSign = document.getElementById('btn-sign');
    const statusDot = document.getElementById('status-dot');
    const debugPanel = document.getElementById('debug-panel');
    const debugStatus = document.getElementById('debug-status');
    const debugText = document.getElementById('debug-text');
    const debugPreview = document.getElementById('debug-preview');
    const controlOverlay = document.getElementById('control-overlay');

    // Configurações salvas no celular
    let ocrMode = localStorage.getItem('ocrMode') || 'date'; // 'date' | 'normal'
    let camFacing = localStorage.getItem('camFacing') || 'environment'; // 'environment' | 'user'
    let showDebug = localStorage.getItem('showDebug') === 'true';

    let currentInput = '0';
    let previousInput = null;
    let operator = null;
    let waitingForOperand = false;

    let forcedResult = null;
    let isScanning = false;
    let mediaStream = null;
    let scanTimer = null;
    let ocrWorker = null;
    let holdAcTimer = null;
    let holdSignTimer = null;

    // --- ATUALIZA UI DO PAINEL DE CONTROLE ---
    function syncControlUI() {
      document.getElementById('mode-date').classList.toggle('selected', ocrMode === 'date');
      document.getElementById('mode-normal').classList.toggle('selected', ocrMode === 'normal');
      document.getElementById('cam-back').classList.toggle('selected', camFacing === 'environment');
      document.getElementById('cam-front').classList.toggle('selected', camFacing === 'user');
      document.getElementById('debug-on').classList.toggle('selected', showDebug);
      document.getElementById('debug-off').classList.toggle('selected', !showDebug);
      debugPanel.classList.toggle('visible', showDebug);
    }

    document.getElementById('mode-date').addEventListener('click', () => {
      ocrMode = 'date';
      localStorage.setItem('ocrMode', ocrMode);
      syncControlUI();
    });

    document.getElementById('mode-normal').addEventListener('click', () => {
      ocrMode = 'normal';
      localStorage.setItem('ocrMode', ocrMode);
      syncControlUI();
    });

    document.getElementById('cam-back').addEventListener('click', () => {
      camFacing = 'environment';
      localStorage.setItem('camFacing', camFacing);
      syncControlUI();
    });

    document.getElementById('cam-front').addEventListener('click', () => {
      camFacing = 'user';
      localStorage.setItem('camFacing', camFacing);
      syncControlUI();
    });

    document.getElementById('debug-on').addEventListener('click', () => {
      showDebug = true;
      localStorage.setItem('showDebug', 'true');
      syncControlUI();
    });

    document.getElementById('debug-off').addEventListener('click', () => {
      showDebug = false;
      localStorage.setItem('showDebug', 'false');
      syncControlUI();
    });

    document.getElementById('btn-close-panel').addEventListener('click', () => {
      controlOverlay.classList.remove('visible');
    });

    syncControlUI();

    // --- CALCULADORA ---
    function formatDisplay(valStr) {
      if (valStr === 'Erro') return 'Erro';
      const [intPart, decPart] = valStr.replace(',', '.').split('.');
      const formattedInt = Number(intPart).toLocaleString('pt-BR');
      const result = decPart !== undefined ? `${formattedInt},${decPart}` : formattedInt;

      if (result.length > 9) displayEl.style.fontSize = '52px';
      else if (result.length > 6) displayEl.style.fontSize = '66px';
      else displayEl.style.fontSize = '82px';

      return result;
    }

    function updateDisplay() {
      displayEl.textContent = formatDisplay(currentInput);
      btnAc.textContent = currentInput === '0' && !previousInput ? 'AC' : 'C';
    }

    function inputNumber(num) {
      if (num === ',') {
        if (waitingForOperand) {
          currentInput = '0,';
          waitingForOperand = false;
        } else if (!currentInput.includes(',')) {
          currentInput += ',';
        }
        updateDisplay();
        return;
      }

      if (waitingForOperand) {
        currentInput = num;
        waitingForOperand = false;
      } else {
        currentInput = currentInput === '0' ? num : currentInput + num;
      }
      updateDisplay();
    }

    function performCalculation(a, b, op) {
      switch (op) {
        case '+': return a + b;
        case '-': return a - b;
        case '*': return a * b;
        case '/': return b === 0 ? 'Erro' : a / b;
        default: return b;
      }
    }

    function handleOperator(nextOp) {
      const inputValue = parseFloat(currentInput.replace(',', '.'));
      if (previousInput === null) {
        previousInput = inputValue;
      } else if (operator && !waitingForOperand) {
        const result = performCalculation(previousInput, inputValue, operator);
        currentInput = String(result).replace('.', ',');
        previousInput = result === 'Erro' ? null : result;
      }
      waitingForOperand = true;
      operator = nextOp;
      updateDisplay();
    }

    function handleEquals() {
      if (forcedResult !== null) {
        currentInput = String(forcedResult);
        previousInput = null;
        operator = null;
        waitingForOperand = true;
        forcedResult = null;
        statusDot.className = '';
        updateDisplay();
        return;
      }

      if (operator && previousInput !== null) {
        const inputValue = parseFloat(currentInput.replace(',', '.'));
        const result = performCalculation(previousInput, inputValue, operator);
        currentInput = String(result).replace('.', ',');
        previousInput = null;
        operator = null;
        waitingForOperand = true;
        updateDisplay();
      }
    }

    function clearCalc() {
      currentInput = '0';
      previousInput = null;
      operator = null;
      waitingForOperand = false;
      updateDisplay();
    }

    document.querySelectorAll('[data-num]').forEach(btn => {
      btn.addEventListener('click', () => inputNumber(btn.dataset.num));
    });

    document.querySelectorAll('[data-op]').forEach(btn => {
      btn.addEventListener('click', () => handleOperator(btn.dataset.op));
    });

    document.getElementById('btn-eq').addEventListener('click', handleEquals);

    document.querySelector('[data-action="percent"]').addEventListener('click', () => {
      const val = parseFloat(currentInput.replace(',', '.')) / 100;
      currentInput = String(val).replace('.', ',');
      updateDisplay();
    });

    // --- GATILHO OCULTO 1: SEGURAR "±" POR 1s ABRE O PAINEL DE CONTROLE ---
    btnSign.addEventListener('pointerdown', () => {
      holdSignTimer = setTimeout(() => {
        controlOverlay.classList.add('visible');
      }, 1000);
    });
    btnSign.addEventListener('pointerup', () => clearTimeout(holdSignTimer));
    btnSign.addEventListener('pointerleave', () => clearTimeout(holdSignTimer));
    btnSign.addEventListener('click', () => {
      if (currentInput !== '0') {
        currentInput = currentInput.startsWith('-') ? currentInput.slice(1) : '-' + currentInput;
        updateDisplay();
      }
    });

    // --- GATILHO OCULTO 2: SEGURAR "AC" POR 800ms LIGA/DESLIGA O OCR ---
    btnAc.addEventListener('pointerdown', () => {
      holdAcTimer = setTimeout(() => {
        if (isScanning) stopSecretScanner();
        else startSecretScanner();
      }, 800);
    });
    btnAc.addEventListener('pointerup', () => clearTimeout(holdAcTimer));
    btnAc.addEventListener('pointerleave', () => clearTimeout(holdAcTimer));
    btnAc.addEventListener('click', clearCalc);

    // --- PROCESSAMENTO DOS DOIS MODOS ---
    function calcularDiasDaData(textoOCR) {
      const limpo = textoOCR.replace(/[.,\s-]/g, '');
      const matches = limpo.match(/\d{6}/g);
      if (!matches) return null;

      const hoje = new Date();
      const anoAtualCurto = hoje.getFullYear() % 100;

      for (const bloco of matches) {
        const dia = parseInt(bloco.slice(0, 2), 10);
        const mes = parseInt(bloco.slice(2, 4), 10);
        const anoCurto = parseInt(bloco.slice(4, 6), 10);

        if (dia < 1 || dia > 31 || mes < 1 || mes > 12) continue;

        const anoCompleto = anoCurto > anoAtualCurto ? 1900 + anoCurto : 2000 + anoCurto;
        const dataAlvo = new Date(anoCompleto, mes - 1, dia);

        if (dataAlvo.getDate() !== dia || dataAlvo.getMonth() !== mes - 1) continue;

        const hojeZerado = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate());
        const diffMs = Math.abs(hojeZerado - dataAlvo);
        return Math.floor(diffMs / (1000 * 60 * 60 * 24));
      }
      return null;
    }

    function extrairNumeroNormal(textoOCR) {
      const limpo = textoOCR.replace(/[.,\s-]/g, '');
      const matches = limpo.match(/\d{2,}/g);
      if (!matches) return null;
      // Retorna a maior sequência numérica lida na tela
      matches.sort((a, b) => b.length - a.length);
      return matches[0];
    }

    async function initWorker() {
      if (!ocrWorker) {
        debugStatus.textContent = 'Status: Baixando motor OCR...';
        ocrWorker = await Tesseract.createWorker('eng');
        await ocrWorker.setParameters({
          tessedit_char_whitelist: '0123456789., '
        });
      }
    }

    async function startSecretScanner() {
      if (isScanning) return;
      isScanning = true;
      forcedResult = null;
      statusDot.className = 'loading';
      debugStatus.textContent = 'Status: Abrindo câmera...';

      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: camFacing, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });

        const video = document.getElementById('hidden-video');
        video.srcObject = mediaStream;
        await video.play();

        await initWorker();
        statusDot.className = 'scanning';
        debugStatus.textContent = ocrMode === 'date'
          ? 'Modo: Conta de Dias (aponte para 6 dígitos)'
          : 'Modo: Leitura Normal (aponte para o número)';
        scanFrame();
      } catch (err) {
        debugStatus.textContent = 'Erro: ' + err.message;
        stopSecretScanner();
      }
    }

    function preprocessCanvas(ctx, w, h) {
      const imgData = ctx.getImageData(0, 0, w, h);
      const data = imgData.data;
      let totalLuma = 0;

      for (let i = 0; i < data.length; i += 4) {
        totalLuma += 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
      }

      const isDarkBg = (totalLuma / (data.length / 4)) < 128;

      for (let i = 0; i < data.length; i += 4) {
        let gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
        if (isDarkBg) gray = 255 - gray;
        const val = gray > 140 ? 255 : 0;
        data[i] = data[i + 1] = data[i + 2] = val;
      }

      ctx.putImageData(imgData, 0, 0);
    }

    async function scanFrame() {
      if (!isScanning) return;

      const video = document.getElementById('hidden-video');
      const canvas = document.getElementById('hidden-canvas');

      if (video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth > 0) {
        const cropW = Math.floor(video.videoWidth * 0.75);
        const cropH = Math.floor(video.videoHeight * 0.35);
        const cropX = Math.floor((video.videoWidth - cropW) / 2);
        const cropY = Math.floor((video.videoHeight - cropH) / 2);

        canvas.width = cropW;
        canvas.height = cropH;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

        preprocessCanvas(ctx, cropW, cropH);

        if (showDebug) {
          debugPreview.src = canvas.toDataURL('image/jpeg', 0.6);
        }

        try {
          const { data: { text } } = await ocrWorker.recognize(canvas);
          const cleanText = text.trim();
          debugText.textContent = 'OCR leu: ' + (cleanText || '(nada)');

          const resultado = ocrMode === 'date'
            ? calcularDiasDaData(cleanText)
            : extrairNumeroNormal(cleanText);

          if (resultado !== null) {
            forcedResult = resultado;
            debugStatus.textContent = `CAPTURADO! Resultado: ${resultado} (Aperte =)`;
            stopSecretScanner();
            statusDot.className = 'ready';
            return;
          }
        } catch (e) {
          debugText.textContent = 'Erro OCR: ' + e.message;
        }
      }

      scanTimer = setTimeout(scanFrame, 500);
    }

    function stopSecretScanner() {
      isScanning = false;
      clearTimeout(scanTimer);
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }
      if (forcedResult === null) {
        statusDot.className = '';
      }
    }
  </script>
</body>
</html>
